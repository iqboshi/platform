name: Feature request
description: Propose a product or engineering enhancement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired Outcome
      description: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and Constraints
      description: Capture expected users, data, constraints, and edge cases.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
