name: ci

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "chore/**"
      - "docs/**"
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: python -m pip install --upgrade pip && python -m pip install -e ./backend[dev]
      - name: Ruff
        run: python -m ruff check backend/src backend/tests
      - name: Pytest
        run: python -m pytest backend/tests
      - name: Import check
        run: python -m compileall backend/src

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Install frontend
        run: npm ci
      - name: Lint
        run: npm run lint --workspace @platform/web
      - name: Test
        run: npm run test --workspace @platform/web
      - name: Build
        run: npm run build --workspace @platform/web
